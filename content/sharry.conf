# Rendered by start.sh at container start; the rendered file is written to
# tmpfs (/run) and never shipped in the package or stored in the data volume.
sharry.restserver {

  base-url = "{{BASE_URL}}"

  bind {
    address = "0.0.0.0"
    port = 9090
  }

  backend {
    auth {
      # Upstream's sample ships a fixed admin:admin login. Keep the fixed module
      # but with deployment-generated credentials so no default exists.
      fixed {
        enabled = {{FIXED_ENABLED}}
        user = "{{ADMIN_USER}}"
        password = "{{ADMIN_PASS}}"
      }

      # No self-service registration: accounts are created by the admin inside
      # the app, so the instance is not open to strangers.
      signup {
        mode = "closed"
      }
    }

    jdbc {
      # H2 file database inside the bound data directory; PostgreSQL mode
      # matches the shipped migrations.
      url = "jdbc:h2:///data/sharry.db;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE"
      user = "sa"
      password = ""
    }

    files {
      default-store = "database"
      stores = {
        database = {
          enabled = true
          type = "default-database"
        }
      }
    }
  }
}
