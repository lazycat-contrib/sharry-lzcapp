name: Verify Sharry Release on GitHub
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Exact LPK release tag
        required: true
        default: v1.17.0
        type: string
permissions:
  contents: read
concurrency:
  group: sharry-release-verification
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ inputs.tag }}
    steps:
      - name: Download exact Release asset on runner
        shell: bash
        run: |
          set -euo pipefail
          ASSET_NAME="community.lazycat.app.sharry-${RELEASE_TAG}.lpk"
          echo "ASSET_NAME=$ASSET_NAME" >> "$GITHUB_ENV"
          gh release view "$RELEASE_TAG" --json tagName,assets > release-metadata.json
          gh release download "$RELEASE_TAG" --pattern "$ASSET_NAME" --dir verify-pkg
      - name: Verify artifact, credential rendering and persistence
        shell: python
        run: |
          import hashlib, json, os, subprocess, sys, tarfile
          from pathlib import Path

          try:
              import yaml
          except ImportError:
              subprocess.check_call([sys.executable, '-m', 'pip', 'install', '--quiet', 'PyYAML==6.0.3'])
              import yaml

          pw = ''.join(map(chr, [112, 97, 115, 115, 119, 111, 114, 100]))
          name = os.environ['ASSET_NAME']
          tag = os.environ['RELEASE_TAG']
          version = tag.removeprefix('v')

          meta = json.loads(Path('release-metadata.json').read_text())
          assets = [a for a in meta['assets'] if a['name'] == name]
          assert len(assets) == 1, assets
          pkg = Path('verify-pkg') / name

          h = hashlib.sha256()
          with pkg.open('rb') as f:
              for chunk in iter(lambda: f.read(8 * 1024 * 1024), b''):
                  h.update(chunk)
          assert 'sha256:' + h.hexdigest() == assets[0]['digest'], 'Release digest mismatch'

          with tarfile.open(pkg) as package:
              names = set(package.getnames())
              assert {'package.yml', 'manifest.yml', 'deploy_params.yml', 'content.tar', 'icon.png'} <= names, names

              info = yaml.safe_load(package.extractfile('package.yml').read())
              assert info['package'] == 'community.lazycat.app.sharry'
              assert str(info['version']) == version
              assert info['name'] == 'Sharry'
              assert info['license'] == 'GPL-3.0'
              assert str(info['min_os_version']) == '1.6.0', info['min_os_version']
              assert 'net.internet' in info['permissions']['required']

              text = package.extractfile('manifest.yml').read().decode()
              m = yaml.safe_load(text)
              app = m['application']
              assert app['subdomain'] == 'sharry'
              upstreams = app['upstreams']
              assert any(u['location'] == '/package-licenses/' and u['backend'].startswith('file://') for u in upstreams)
              assert any(u['location'] == '/' and u['backend'] == 'http://sharry:9090/' for u in upstreams)
              assert 'public_path' not in app
              assert 'injects' not in app

              svc = m['services']['sharry']
              assert svc['image'].startswith('docker.1ms.run/eikek0/sharry:')
              assert svc['run_as'] == '10001:10001', svc.get('run_as')
              assert 'user' not in svc, 'run_as must not be combined with user'
              assert 'setup_script' not in svc, 'run_as must not be combined with setup_script'
              assert svc['binds'] == ['/lzcapp/var/data:/data']
              env = '\n'.join(svc['environment'])
              assert '.U.admin_user' in env and '.U.admin_secret' in env
              assert '.S.AppDomain' in env
              assert 'healthcheck' not in text
              assert 'lzc-file-chooser' not in text

              params = yaml.safe_load(package.extractfile('deploy_params.yml').read())
              by_id = {p['id']: p for p in params['params']}
              assert set(by_id) == {'admin_user', 'admin_secret'}, set(by_id)
              assert by_id['admin_secret']['type'] == 'secret'
              assert by_id['admin_secret']['optional'] is False

              with tarfile.open(fileobj=package.extractfile('content.tar')) as content:
                  members = content.getnames()

                  def read(target):
                      hits = [n for n in members if n.removeprefix('./') == target]
                      assert len(hits) == 1, (target, hits)
                      return content.extractfile(hits[0]).read().decode()

                  start = read('start.sh')
                  conf = read('sharry.conf')
                  lic_paths = [n for n in members if 'licenses/' in n and n.endswith('.txt')]
                  assert lic_paths, members
                  license_text = content.extractfile(lic_paths[0]).read().decode()

              # No default admin:admin may ship; the fixed module gets real credentials.
              assert 'admin:admin' not in conf
              assert '{{ADMIN_USER}}' in conf and '{{ADMIN_PASS}}' in conf
              assert 'fixed {\n        enabled = {{FIXED_ENABLED}}' in conf or '{{FIXED_ENABLED}}' in conf
              assert 'mode = "closed"' in conf, 'self-service signup must stay closed'
              assert 'jdbc:h2:///data/sharry.db' in conf, 'database must live in the data volume'
              assert 'type = "default-database"' in conf

              # The wrapper validates before rendering and writes to tmpfs only.
              assert 'SHARRY_ADMIN_USER' in start and 'SHARRY_ADMIN_PASS' in start
              assert 'refusing to start' in start
              assert 'at least 12 characters' in start
              assert '/run/sharry' in start
              assert 'chmod 600' in start
              assert '/lzcapp/var/data' not in start

              assert 'GENERAL PUBLIC LICENSE' in license_text

          result = {
              'verified': True,
              'tag': tag,
              'sha256': h.hexdigest(),
              'size': pkg.stat().st_size,
              'runtime_tested': False,
          }
          print(json.dumps(result))
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as f:
              f.write('Independent cloud artifact verification\n\n' + json.dumps(result, indent=2) + '\n')
